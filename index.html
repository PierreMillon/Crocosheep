<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Crocosheep</title>
<meta name="description" content="Envoie des animaux, pas des mots.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Crocosheep">
<meta name="theme-color" content="#ff8a3d">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="stylesheet" href="style.css?v=11">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-check-compat.js"></script>
</head>
<body>

  <!-- ===== ÉCRAN CONTACTS ===== -->
  <section id="screen-contacts" class="screen" data-screen="contacts">
    <header class="app-header">
      <button id="show-changelog" class="version-badge" aria-label="Voir les nouveautés de cette version">v1</button>
      <h1 class="app-title">Crocosheep</h1>
      <button id="open-profile" class="icon-btn icon-btn-mouton" aria-label="Voir mon profil"></button>
    </header>

    <div class="contacts-list" id="contacts-list"></div>
  </section>

  <!-- ===== ÉCRAN GROUPE ===== -->
  <section id="screen-group" class="screen screen-hidden" data-screen="group">
    <header class="chat-header">
      <button id="back-to-contacts-from-group" class="icon-btn" aria-label="Retour aux contacts">←</button>
      <div class="chat-header-id">
        <span class="contact-code" id="group-label">—</span>
      </div>
      <span class="chat-header-spacer" aria-hidden="true"></span>
    </header>

    <div class="group-body" id="group-body">
      <!-- rendu variable en JS selon le rôle (créateur / membre / invitation) -->
    </div>
  </section>

  <!-- ===== ÉCRAN DISCUSSION ===== -->
  <section id="screen-chat" class="screen screen-hidden" data-screen="chat">
    <header class="chat-header">
      <button id="back-to-contacts" class="icon-btn" aria-label="Retour aux contacts">←</button>
      <button class="chat-header-id chat-header-id-btn" id="chat-code-btn" aria-label="Voir son profil">
        <span class="contact-code" id="chat-code">—</span>
      </button>
      <span class="chat-header-spacer" aria-hidden="true"></span>
    </header>

    <div class="chat-bubbles" id="chat-bubbles"></div>

    <div class="sender-dock">
      <p class="live-clock" id="live-clock">--:--:--</p>
      <div class="send-stack" id="send-stack">
        <!-- une bande plein-largeur par animal débloqué, générées en JS -->
      </div>
    </div>
  </section>

  <!-- ===== ÉCRAN PROFIL ===== -->
  <section id="screen-profile" class="screen screen-hidden" data-screen="profile">
    <header class="app-header">
      <button id="back-to-contacts-from-profile" class="icon-btn" aria-label="Retour">←</button>
      <h1 class="app-title app-title-small">Mon profil</h1>
      <span class="chat-header-spacer" aria-hidden="true"></span>
    </header>

    <div class="profile-card">
      <span class="contact-avatar contact-avatar-big" id="profile-avatar">?</span>
      <p class="profile-id" id="profile-id">—</p>
      <p class="profile-since" id="profile-since"></p>
      <button id="show-recovery-key" class="edit-code-link">Voir ma clé de récupération</button>
      <button id="restore-identity" class="edit-code-link">Restaurer une identité sur cet appareil</button>
    </div>

    <button id="share-link" class="share-btn">Partager mon lien</button>
    <p id="sync-status" class="sync-status"></p>

    <button id="enable-notifications" class="edit-code-link" style="display:block; text-align:center; margin: 0 auto 18px;">🔔 Activer les notifications</button>

    <h2 class="section-title">Vitrine</h2>
    <div class="badge-grid" id="badge-grid"></div>

    <h2 class="section-title">Boutique</h2>
    <p class="shop-disclaimer">Maquette — aucun paiement réel, juste pour visualiser le principe.</p>
    <div class="shop-grid" id="shop-grid"></div>
  </section>

  <div id="changelog-overlay" class="changelog-overlay screen-hidden">
    <div class="changelog-panel">
      <div class="changelog-head">
        <h2>Nouveautés</h2>
        <button id="close-changelog" class="icon-btn" aria-label="Fermer">✕</button>
      </div>
      <div class="changelog-list" id="changelog-list"></div>
    </div>
  </div>

  <div id="public-profile-overlay" class="changelog-overlay screen-hidden">
    <div class="changelog-panel">
      <div class="changelog-head">
        <h2 id="public-profile-title">Profil</h2>
        <button id="close-public-profile" class="icon-btn" aria-label="Fermer">✕</button>
      </div>
      <div class="public-profile-grid" id="public-profile-grid"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="firebase-config.js"></script>
  <!-- Le ?v=N ci-dessous DOIT être incrémenté à chaque déploiement, sinon
       certains navigateurs continuent de servir l'ancien script.js en
       cache alors que index.html, lui, s'est mis à jour — mélange qui
       peut casser l'appli (ex. HTML récent + JS obsolète qui ne se
       correspondent plus). -->
  <script src="script.js?v=12"></script>
</body>
</html>
